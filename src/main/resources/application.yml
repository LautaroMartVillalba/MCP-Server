spring:
  ai:
    mcp:
      server:
        name: mcp-server
        protocol: streamable
        stdio: false
        type: sync
        enabled: true
  application:
    name: mcp-server
  datasource:
    username: hotelms
    password: hotelms
    url: jdbc:postgresql://localhost:5431/hotel
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

server:
  port: 8000
